<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Ussi mäng</title>

    <style>
        body {
            text-align: center;
            background-color: #222;
            color: white;
            font-family: Arial;
        }

        canvas {
            background-color: black;
            border: 3px solid white;
        }
    </style>
</head>

<body>

    <h1>Ussi mäng</h1>
    <h2>Skoor: <span id="skoor">0</span></h2>

    <canvas id="mang" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("mang");
        const ctx = canvas.getContext("2d");

        const ruut = 20;

        let uss = [
            { x: 200, y: 200 }
        ];

        let toit = {
            x: 100,
            y: 100
        };

        let dx = ruut;
        let dy = 0;

        let skoor = 0;
        let mangib = true;

        document.addEventListener("keydown", liiguta);

        function liiguta(e) {
            if (e.key === "ArrowUp" && dy === 0) {
                dx = 0;
                dy = -ruut;
            }

            if (e.key === "ArrowDown" && dy === 0) {
                dx = 0;
                dy = ruut;
            }

            if (e.key === "ArrowLeft" && dx === 0) {
                dx = -ruut;
                dy = 0;
            }

            if (e.key === "ArrowRight" && dx === 0) {
                dx = ruut;
                dy = 0;
            }
        }

        function joonista() {
            if (!mangib) return;

            ctx.clearRect(0, 0, 400, 400);

            let pea = {
                x: uss[0].x + dx,
                y: uss[0].y + dy
            };

            // Seina kontroll
            if (
                pea.x < 0 || pea.x >= 400 ||
                pea.y < 0 || pea.y >= 400
            ) {
                mangib = false;
                alert("Mäng läbi! Skoor: " + skoor);
                return;
            }

            uss.unshift(pea);

            // Toidu söömine
            if (pea.x === toit.x && pea.y === toit.y) {
                skoor++;
                document.getElementById("skoor").textContent = skoor;

                toit.x = Math.floor(Math.random() * 20) * ruut;
                toit.y = Math.floor(Math.random() * 20) * ruut;
            } else {
                uss.pop();
            }

            // Ussi joonistamine
            ctx.fillStyle = "lime";

            uss.forEach(osa => {
                ctx.fillRect(osa.x, osa.y, ruut - 2, ruut - 2);
            });

            // Toidu joonistamine
            ctx.fillStyle = "red";
            ctx.fillRect(toit.x, toit.y, ruut, ruut);
        }

        setInterval(joonista, 120);
    </script>

</body>
</html>
